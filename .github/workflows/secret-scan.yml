name: secret-scan

# This repository holds a README and release files only; the scan keeps it
# that way by failing on anything that looks like a credential.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        run: |
          set -euo pipefail
          VERSION=8.21.2
          ARCHIVE="gitleaks_${VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -sSfL -o "$ARCHIVE" "$BASE/$ARCHIVE"
          curl -sSfL -o checksums.txt "$BASE/gitleaks_${VERSION}_checksums.txt"
          grep " ${ARCHIVE}\$" checksums.txt | sha256sum -c -
          tar -xz -f "$ARCHIVE" gitleaks
          ./gitleaks git . --redact --no-banner
